<svg fill="none" viewBox="0 0 800 160" width="100%" height="160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="minBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="160" rx="12" fill="url(#minBg)" stroke="#30363d" stroke-width="1"/>

  <!-- Minimal Accent Line -->
  <rect x="40" y="35" width="4" height="90" rx="2" fill="url(#cyanGrad)"/>

  <!-- Content Container -->
  <g transform="translate(60, 0)">
    <!-- Subtitle / Role -->
    <text x="0" y="52" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="2">
      DATA SCIENTIST &bull; AI/ML ENGINEER
    </text>

    <!-- Main Title -->
    <text x="0" y="92" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f0f6fc" letter-spacing="-0.5">
      Radhika Rajput
    </text>

    <!-- Description -->
    <text x="0" y="118" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#8b949e">
      Building scalable deep learning systems, LLMs, and computer vision solutions.
    </text>
  </g>

  <!-- Status Pill (Top Right) -->
  <g transform="translate(590, 35)">
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#10b981"/>
    <text x="28" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#d1d5db">
      Available for AI Roles
    </text>
  </g>
</svg>
