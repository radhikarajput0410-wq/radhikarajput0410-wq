<svg fill="none" viewBox="0 0 1180 610" width="100%" height="610" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;family=Inter:wght@400;600;800&amp;display=swap');

      .bg-main { fill: #F8FAFC; }
      .ui-chrome { stroke: #0891B2; stroke-width: 1; }
      .text-head { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 600; fill: #0891B2; letter-spacing: 1.5px; }
      .text-label { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 500; fill: #64748B; }
      .text-val { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 600; fill: #0F172A; }
      .text-accent { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 600; fill: #10B981; }
      .text-cyan { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 600; fill: #0891B2; }
      
      @keyframes pulseRed {
        0% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.95); }
        100% { opacity: 1; transform: scale(1); }
      }
      .live-dot { animation: pulseRed 1.8s infinite ease-in-out; transform-origin: 940px 92px; }

      @keyframes dotDrift {
        0% { opacity: 0.85; transform: translateY(0px); }
        50% { opacity: 1.0; transform: translateY(-1.5px); }
        100% { opacity: 0.85; transform: translateY(0px); }
      }
      .dither-layer { animation: dotDrift 4s infinite ease-in-out; }
    </style>

    <linearGradient id="portraitGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <linearGradient id="borderGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8"/>
    </linearGradient>

    <pattern id="dotGridLight" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="0.8" fill="#0891B2" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Main Terminal Outer Window -->
  <rect width="1180" height="610" rx="12" fill="#F8FAFC" stroke="url(#borderGradLight)" stroke-width="1.5"/>

  <!-- Terminal Top Header Bar -->
  <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 1168 0 C 1174.63 0 1180 5.37 1180 12 L 1180 40 L 0 40 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="24" cy="20" r="5.5" fill="#EF4444"/>
  <circle cx="42" cy="20" r="5.5" fill="#F59E0B"/>
  <circle cx="60" cy="20" r="5.5" fill="#10B981"/>

  <!-- Window Title -->
  <text x="590" y="25" text-anchor="middle" font-family="'Fira Code', monospace" font-size="13" font-weight="600" fill="#475569" letter-spacing="1.5">
    profile.sh --live
  </text>

  <!-- Left Panel: VISUAL.MAP -->
